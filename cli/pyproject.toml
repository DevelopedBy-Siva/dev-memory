[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devmemory-cli"
version = "0.2.0"
description = "AI-powered context restoration for developers."
authors = [{ name = "Sivasanker N P" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "google-generativeai>=0.8.5",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "watchdog>=4.0.0",
]

[project.scripts]
devmemory = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "devmemory_daemon", "devmemory_daemon.*"]
